sentence=Comprehensive library for the Boardoza ESP32 Data Logger with BNO055 IMU, MS5611, u-blox GPS, and MicroSD storage.
paragraph=This library provides an all-in-one API for the Boardoza Data Logger board. It seamlessly integrates the onboard ESP32-S MCU with the BNO055 9-axis IMU, MS5611 pressure/temperature sensor, and u-blox SAM-M8Q GPS module. The library simplifies acquiring complex telemetry data—such as acceleration, angular velocity, magnetic field, altitude, location, speed, and timestamps—and facilitates efficient data logging directly to a MicroSD card. Designed for quick integration into IoT, telemetry, and tracking projects.
category=Data Storage
